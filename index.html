<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="医療者のための多重課題シミュレーション（個人戦・チーム対抗戦）">
<title>多重課題シミュレーション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

<!-- ================= ここから設定 =================
  Firebase コンソール →「プロジェクトの設定」→「マイアプリ」に表示される値のうち、
  apiKey〜appId の6項目だけを下の " " の中に入れてください。
  import で始まる行や initializeApp の行は貼らないでください。
  YOUR_API_KEY のままなら「ひとりで練習」だけのモードで動きます。
-->
<script>
  window.FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.firebasestorage.app",
    messagingSenderId: "",
    appId: ""
  };
  // 動画ファイルの直接アップロード（Blazeプランで Storage を有効にした場合のみ true）
  window.STORAGE_ENABLED = false;
</script>
<!-- ================= ここまで設定 ================= -->

<script>
  if (!window.FIREBASE_CONFIG) window.FIREBASE_CONFIG_ERROR = '設定ブロックの書式が正しくありません（" " や , の抜けを確認してください）';
  window.addEventListener('error', function (e) {
    var v = document.getElementById('view');
    if (v && v.querySelector('.boot')) {
      v.innerHTML = '<div style="background:#fff;border-left:4px solid #B3261E;padding:1rem;border-radius:6px"><strong>読み込みエラー / Load error</strong><p style="font-size:.9rem;word-break:break-all">'
        + String((e.message || '') + ' ' + (e.filename || '') + ':' + (e.lineno || '')).replace(/</g, '&lt;') + '</p></div>';
    }
  }, true);
</script>
<style>
:root {
  --wall: #E4ECEB;      /* 病棟の壁 */

  --ink: #14283A;       /* 夜のナースステーション */

  --rule: #C2D0CF;
  --act: #0B6477;
  --lamp: #E9A800;      /* 呼び出しランプ */
  --p1: #B3261E; --p2: #B86E00; --p3: #2E7552; --p4: #687888;
  --good: #2E7552; --bad: #B3261E;
  --tA: #1F5FA8; --tB: #8A3B8F;
  --r: 6px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--wall); color: var(--ink);
  font-family: "BIZ UDPGothic", "Noto Sans KR", "Noto Sans SC", system-ui, sans-serif;
  font-size: 16px; line-height: 1.65;
}
:lang(ko) body, body:lang(ko) { font-family: "Noto Sans KR", "BIZ UDPGothic", system-ui, sans-serif; }
:lang(zh) body, body:lang(zh) { font-family: "Noto Sans SC", "BIZ UDPGothic", system-ui, sans-serif; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .6rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1.05rem; }
p { margin: .3rem 0 .8rem; }
a { color: var(--act); }
code { background: #fff; padding: .1rem .35rem; border-radius: 3px; word-break: break-all; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink2); }
.small { font-size: .82rem; }
.boot { color: var(--ink2); }

/* ヘッダー */
#hdr { display: flex; justify-content: space-between; align-items: center; gap: .8rem; flex-wrap: wrap; padding: .55rem 1.2rem; background: var(--ink); color: #fff; }
.brand { color: #fff; text-decoration: none; font-weight: 700; }
.hdr-r { display: flex; align-items: center; gap: .6rem; }
.hdr-r select { width: auto; min-height: 34px; padding: .2rem .5rem; }

#hdr .btn { background: #fff; color: var(--ink); }
#hdr .btn.ghost { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.8); }

main { max-width: 1100px; margin: 0 auto; padding: 1.6rem 1.2rem 5rem; }

/* 部品 */
input, select, textarea {
  font: inherit; color: var(--ink); background: #fff; width: 100%;
  border: 1px solid var(--rule); border-radius: 4px; padding: .45rem .6rem; min-height: 42px;
}
textarea { min-height: auto; }
input[type=radio], input[type=checkbox] { width: auto; min-height: 0; accent-color: var(--act); }
label { display: grid; gap: .25rem; font-size: .9rem; color: var(--ink2); }

.btn {

  background: var(--act); color: #fff; padding: .55rem 1.1rem; min-height: 44px; text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--act); box-shadow: inset 0 0 0 1.5px var(--act); }
.btn.sm { min-height: 36px; padding: .3rem .8rem; font-size: .9rem; }

.w-md { max-width: 480px; }

.seg { border: 0; padding: 0; margin: .6rem 0; display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; }
.seg legend { font-size: .9rem; color: var(--ink2); margin-bottom: .3rem; padding: 0; }

/* ホーム：呼び出しランプが一度だけ順に点灯する */
.hero h1 { font-size: clamp(2.1rem, 6.5vw, 3.6rem); letter-spacing: -.01em; margin-top: .4rem; }
.lead { font-size: 1.15rem; color: var(--ink2); max-width: 34em; }

.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.2rem; }

.joinrow { display: flex; gap: .5rem; margin-top: .8rem; }

.foot { margin-top: 2.5rem; font-size: .85rem; color: var(--ink2); display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.foot p { max-width: 46em; }

/* ロビー */
.lobby { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 1.6rem; }
.code-box { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 1rem; align-self: start; text-align: center; }
.code { font-size: 2.3rem; font-weight: 700; letter-spacing: .14em; margin: 0; font-variant-numeric: tabular-nums; }
#qr { display: inline-block; background: #fff; padding: 8px; margin: .6rem 0; }
#qr img, #qr canvas { display: block; }
.plist { list-style: none; padding: 0; margin: 0 0 1rem; }
.plist li { display: flex; gap: .4rem 1rem; flex-wrap: wrap; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--rule); }
.brief { background: var(--panel); border-left: 4px solid var(--lamp); padding: .8rem 1rem; margin: .8rem 0; border-radius: 0 var(--r) var(--r) 0; }
@media (max-width: 720px) { .lobby { grid-template-columns: 1fr; } }

/* ゲーム */
.gbar { display: flex; flex-wrap: wrap; gap: .8rem 2rem; align-items: flex-end; background: var(--ink); color: #fff; padding: .8rem 1.2rem; border-radius: var(--r); }
.gtitle { flex: 1 1 260px; display: grid; }
.meta { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .82rem; opacity: .8; }
.gstat { display: grid; justify-items: end; }
.num { font-variant-numeric: tabular-nums; font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
.num-s { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.gtools { display: flex; align-items: center; gap: .8rem; }
.snd { display: flex; align-items: center; gap: .3rem; color: #fff; }
.btn.light { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.7); }
.hint { background: #FFF1C2; padding: .45rem .8rem; border-radius: 4px; margin: .7rem 0 0; font-size: .9rem; }
.ggrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.2rem; margin-top: 1rem; }
.calls { background: #1B3346; border-radius: var(--r); padding: 1rem; min-height: 340px; }
.calls h2 { color: #DCE6EA; }
.call { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .8rem; align-items: center; background: var(--panel); border-radius: 4px; padding: .7rem .8rem; margin-bottom: .6rem; }
.call .lamp { align-self: start; margin-top: .4rem; }
.call.new .lamp { animation: blink .6s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.ct { margin: 0; font-weight: 700; }
.dl { height: 5px; background: #DCE5E4; border-radius: 3px; margin-top: .45rem; overflow: hidden; }
.dl i { display: block; height: 100%; width: 100%; background: var(--act); }
.dl i.low { background: var(--p1); }
.ca { display: flex; flex-direction: column; gap: .4rem; }
.empty { color: #9FB3BD; margin: .4rem 0; }
.empty.dark { color: var(--ink2); }
.side h2 { font-size: .95rem; color: var(--ink2); margin: 1rem 0 .4rem; }
.side h2:first-child { margin-top: 0; }
.work { background: var(--panel); border: 2px solid var(--act); border-radius: var(--r); padding: .8rem; }
.prog { height: 10px; background: #DCE5E4; border-radius: 5px; overflow: hidden; margin: .55rem 0 .7rem; }
.prog i { display: block; height: 100%; width: 0; background: var(--act); }
.pz { background: var(--panel); border-left: 4px solid var(--lamp); border-radius: 0 4px 4px 0; padding: .55rem .8rem; margin-bottom: .5rem; display: grid; gap: .3rem; justify-items: start; }
.pz p { margin: 0; }
.ok { color: var(--good); font-weight: 700; } .warn { color: var(--p2); font-weight: 700; }
.staff { display: inline-block; padding: .15rem .7rem; border-radius: 999px; background: #D3EADF; color: var(--good); font-size: .85rem; margin: 0 .4rem .3rem 0; }
.staff.busy { background: #E3E6E8; color: #6B7680; }
.rank { list-style: none; padding: 0; margin: 0; counter-reset: r; }
.rank li { display: flex; gap: .5rem; align-items: center; padding: .35rem .3rem; border-bottom: 1px solid var(--rule); counter-increment: r; }
.rank li::before { content: counter(r); min-width: 1.4em; font-weight: 700; color: var(--ink2); }
.rank li.me { background: #FFF1C2; }
.rank .rn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .rs { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .8rem; }
.team { background: var(--panel); border: 1px solid var(--rule); border-top: 4px solid; border-radius: 0 0 var(--r) var(--r); padding: .5rem .7rem; display: grid; }
.team.tA { border-top-color: var(--tA); } .team.tB { border-top-color: var(--tB); }
.tavg { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
@media (max-width: 780px) { .ggrid { grid-template-columns: 1fr; } }
@media (max-width: 520px) {
  .call { grid-template-columns: auto minmax(0, 1fr); }

}

/* 安全確認・カウントダウン・通知 */
.modal { position: fixed; inset: 0; background: rgba(20, 40, 58, .6); display: grid; place-items: center; padding: 1rem; z-index: 50; }
.mbox { background: var(--panel); border-radius: var(--r); padding: 1.4rem; width: min(100%, 580px); max-height: 90vh; overflow: auto; }
.q { font-weight: 700; font-size: 1.05rem; }
.opt { display: block; width: 100%; text-align: left; margin: .5rem 0; padding: .8rem 1rem; min-height: 48px; font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--rule); border-radius: 4px; cursor: pointer; }
.opt:hover { border-color: var(--act); }
.count { position: fixed; inset: 0; display: grid; place-items: center; font-size: 8rem; font-weight: 700; color: #fff; background: rgba(20, 40, 58, .82); z-index: 60; font-variant-numeric: tabular-nums; }
#toasts { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); display: grid; gap: .4rem; z-index: 70; width: min(92vw, 440px); pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: .55rem 1rem; border-radius: 4px; font-size: .95rem; }
.toast.bad { background: var(--bad); } .toast.good { background: var(--good); }

/* 結果 */
.res-head { text-align: center; margin-bottom: .5rem; }
.big-score { font-size: clamp(3.6rem, 13vw, 6.4rem); font-weight: 700; line-height: 1; margin: .2rem 0; font-variant-numeric: tabular-nums; }
.res-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1.2rem; align-items: start; }
.res-grid > .card { margin-top: 1.2rem; }
@media (max-width: 820px) { .res-grid { grid-template-columns: 1fr; } }
.ax { display: grid; grid-template-columns: 9em minmax(0, 1fr) 6.5em; gap: .8rem; align-items: center; padding: .3rem 0; }
.axbar { height: 9px; background: #DCE5E4; border-radius: 5px; overflow: hidden; }
.axbar i { display: block; height: 100%; background: var(--act); }
.axbar i.neg { background: var(--p1); }
.fb { padding-left: 1.2rem; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--ink2); font-weight: 700; white-space: nowrap; }
.oc-missed, .oc-incomplete { color: var(--bad); font-weight: 700; }
.oc-done, .oc-delegated { color: var(--good); }

/* 管理画面 */
.tabs { display: flex; gap: .2rem; flex-wrap: wrap; border-bottom: 2px solid var(--ink); }
.tab { background: none; border: 0; padding: .6rem 1rem; font: inherit; cursor: pointer; color: var(--ink2); border-radius: 4px 4px 0 0; }
.tab.on { background: var(--ink); color: #fff; }
.split { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 1.4rem; margin-top: 1rem; }
@media (max-width: 780px) { .split { grid-template-columns: 1fr; } }
.slist ul { list-style: none; padding: 0; margin: .8rem 0; max-height: 72vh; overflow: auto; }
.linkish { display: grid; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: .4rem .6rem; font: inherit; color: var(--ink); cursor: pointer; }
.linkish.on { border-left-color: var(--act); background: var(--panel); }
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.5; }
fieldset.lang { border: 1px solid var(--rule); border-radius: 4px; padding: .6rem .8rem; margin: 0; display: grid; gap: .5rem; }
.help summary { cursor: pointer; color: var(--act); }
.vrow { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: .8rem 1rem; margin: .6rem 0; }
.vf { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .4rem; }
.vf input[type=url] { flex: 1 1 280px; width: auto; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.data td, .data th { font-size: .82rem; }
.bad { color: var(--bad); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .demo-call { opacity: 1; }
}
.cfgerr { border-left: 4px solid var(--bad); }

</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"><p class="boot">Loading…</p></main>
<div id="toasts" aria-live="polite"></div>
<noscript>JavaScript を有効にしてください。</noscript>
<script type="module">
// ===== data =====
// 表示テキストは [日本語, English, 한국어, 中文] の順。
// 管理画面で追加・編集したシナリオは {ja, en, ko, zh} 形式で Firestore に保存され、ここの既定値より優先されます。
// p: 1=生命 2=安全 3=苦痛 4=その他 / dur: 対応に要する秒 / dl: 到着から期限までの秒
// at: 到着時刻（秒）/ del: 同僚に任せてよいか / chk: 安全確認キー / lv: 出現する最低レベル(0-3)

  pt: ['理学療法士', 'Physical therapist', '물리치료사', '物理治疗师'],

  ['4年目以上', '4+ years', '4년차 이상', '4年以上'],

const PRIORITY = {

  2: ['安全', 'Safety', '안전', '安全'],

// 選択肢の先頭が正解（表示時にシャッフル）
const CHECKS = {

// ===== engine =====
// 多重課題ゲームのロジック。画面描画には依存しません。
// スコアの5軸：priority 優先順位 / time 時間 / safety 安全確認 / resume 再開 / comm 委任・報告

const LEVEL_MULT = [1.0, 1.1, 1.2, 1.3];   // 経験レベルによる得点係数
const ARRIVE_F = [1.15, 1.0, 0.85, 0.72];           // レベルが上がるほど呼び出しが早く来る
const DEADLINE_F = [1.3, 1.0, 0.9, 0.8];            // レベルが上がるほど期限が短い
const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

class Game {
  constructor({ scenario, level = 1, extraStaff = 0, onChange, onTick, onEvent, onEnd }) {
    this.sc = scenario;
    this.level = Math.max(0, Math.min(3, level | 0));
    this.onChange = onChange || (() => {});
    this.onTick = onTick || (() => {});
    this.onEvent = onEvent || (() => {});
    this.onEnd = onEnd || (() => {});
    const fa = ARRIVE_F[this.level], fd = DEADLINE_F[this.level];
    this.tasks = (scenario.tasks || [])
      .filter(d => (d.lv || 0) <= this.level)
      .map(d => ({
        def: d, id: String(d.id), p: d.p, state: 'future', outcome: null,
        arriveT: d.at * fa, window: d.dl * fd, deadlineT: d.at * fa + d.dl * fd,
        work: d.dur, progress: 0, memo: false, checked: false, prioScored: false, pauses: 0,
      }));
    this.staff = Array(1 + extraStaff).fill(0);   // 同僚が空く時刻
    this.limit = scenario.limit || 150;
    this.t = 0;
    this.active = null;
    this.running = false;
    this.finished = false;
    this.axes = { priority: 0, time: 0, safety: 0, resume: 0, comm: 0 };
    this.stats = { badPriority: 0, noMemo: 0, badDelegate: 0, checkWrong: 0, expired: 0, done: 0, delegated: 0 };
    this.log = [];
    this.maxPossible = this.tasks.reduce((s, x) => s + 8 + 20 + (x.def.chk ? 8 : 0), 0) || 1;
  }

  find(id) { return this.tasks.find(x => x.id === String(id)); }
  ev(type, x) { const e = { type, t: +this.t.toFixed(1), id: x ? x.id : null }; this.log.push(e); this.onEvent({ ...e, task: x }); }
  changed() { this.onChange(this); }

  start() {
    if (this.running || this.finished) return;
    this.running = true;
    let last = now();
    this.timer = setInterval(() => {
      const n = now(); const dt = Math.min(1, (n - last) / 1000); last = n;
      this.tick(dt);
    }, 200);
  }

  stop() { clearInterval(this.timer); this.running = false; }

  tick(dt) {
    if (!this.running) return;
    this.t += dt;
    let ch = false;
    for (const x of this.tasks) {
      if (x.state === 'future' && this.t >= x.arriveT) { x.state = 'pending'; ch = true; this.ev('arrive', x); }
      else if (x.state === 'pending' && this.t >= x.deadlineT) { this.miss(x); ch = true; }
      else if (x.state === 'delegated' && this.t >= x.doneT) {
        x.state = 'done'; x.outcome = 'delegated';
        this.axes.time += x.doneT <= x.deadlineT ? 10 : 2; ch = true;
      }
    }
    const a = this.active;
    if (a) { a.progress += dt; if (a.progress >= a.work) { this.complete(a); ch = true; } }
    if (ch) this.changed();
    this.onTick(this);
    const allClosed = this.tasks.every(x => x.state === 'done' || x.state === 'missed');
    if (this.t >= this.limit || allClosed) this.finish();
  }

  // 着手（新規・再開）の判断。優先順位を評価し、安全確認が必要なら 'check' を返す
  requestStart(x) {
    if (!this.running || !x || x === this.active || !(x.state === 'pending' || x.state === 'paused')) return 'no';
    this.evalPriority(x);
    if (x.def.chk && !x.checked) return 'check';
    this.begin(x);
    return 'ok';
  }

  evalPriority(x) {
    const others = this.tasks.filter(y => y !== x && (y.state === 'pending' || y.state === 'paused' || y.state === 'active'));
    const best = Math.min(x.p, ...others.map(y => y.p));
    if (x.p <= best) {
      if (!x.prioScored) { this.axes.priority += 8; x.prioScored = true; }
      return true;
    }
    this.axes.priority -= 4 * (x.p - best);
    this.stats.badPriority++;
    this.ev('badPriority', x);
    return false;
  }

  answerCheck(x, ok) {
    if (!x || x.checked) return;
    x.checked = true;
    if (ok) { this.axes.safety += 8; this.ev('checkOk', x); }
    else { this.axes.safety -= 10; this.stats.checkWrong++; this.ev('checkWrong', x); }
    if (this.running && x !== this.active && (x.state === 'pending' || x.state === 'paused')) this.begin(x);
    else this.changed();
  }

  begin(x) {
    const a = this.active;
    if (a && a !== x) {
      a.state = 'paused'; a.pauses++;
      if (a.memo) this.ev('pauseMemo', a);
      else { this.stats.noMemo++; this.ev('pauseNoMemo', a); }
    }
    if (x.state === 'paused') {
      if (x.memo) { this.axes.resume += 4; this.ev('resumeOk', x); }
      else { this.axes.resume -= 6; this.ev('resumeSlip', x); }
      x.memo = false;
    }
    x.state = 'active';
    this.active = x;
    this.changed();
  }

  memo() {
    if (this.active && !this.active.memo) { this.active.memo = true; this.ev('memo', this.active); this.changed(); }
  }

  delegate(x) {
    if (!this.running || !x || x.state !== 'pending') return 'no';
    if (!x.def.del) {
      this.axes.comm -= 8; this.stats.badDelegate++; this.ev('badDelegate', x);
      return 'bad';
    }
    const i = this.staff.findIndex(b => b <= this.t);
    if (i < 0) { this.ev('noStaff', x); return 'busy'; }
    this.staff[i] = this.t + x.work * 1.3;
    x.state = 'delegated'; x.doneT = this.staff[i];
    this.axes.comm += 6; this.stats.delegated++;
    this.ev('delegated', x);
    this.changed();
    return 'ok';
  }

  complete(x) {
    x.state = 'done'; x.outcome = 'done';
    if (this.active === x) this.active = null;
    const late = this.t > x.deadlineT;
    this.axes.time += late ? 2 : 10 + Math.round(10 * Math.max(0, x.deadlineT - this.t) / x.window);
    this.stats.done++;
    this.ev('done', x);
  }

  miss(x) {
    x.state = 'missed'; x.outcome = 'missed';
    this.axes.time -= (5 - x.p) * 6;
    if (x.p === 1) this.axes.safety -= 10;
    this.stats.expired++;
    this.ev('missed', x);
  }

  total() { return Object.values(this.axes).reduce((s, v) => s + v, 0); }
  liveScore() { return Math.round(1000 * this.total() / this.maxPossible * LEVEL_MULT[this.level]); }

  finish() {
    if (this.finished) return;
    this.stop();
    this.finished = true;
    for (const x of this.tasks) {
      if (x.state === 'pending' || x.state === 'paused' || x.state === 'active' || x.state === 'delegated') {
        if (x.state === 'delegated') { x.outcome = 'delegated'; continue; }
        x.outcome = 'incomplete';
        this.axes.time -= (5 - x.p) * 3;
      } else if (x.state === 'future') x.outcome = 'notArrived';
    }
    this.active = null;
    this.changed();
    this.onEnd(this.result());
  }

  result() {
    const shown = this.tasks.filter(x => x.outcome !== 'notArrived');
    return {
      scenarioId: this.sc.id,
      level: this.level,
      score: this.liveScore(),
      total: this.total(),
      maxPossible: this.maxPossible,
      axes: { ...this.axes },
      axMax: {
        priority: 8 * shown.length,
        time: 20 * shown.length,
        safety: 8 * shown.filter(x => x.def.chk).length,
        resume: 0,
        comm: 6 * Math.min(shown.filter(x => x.def.del).length, 3),
      },
      stats: { ...this.stats },
      duration: Math.round(this.t),
      tasks: shown.map(x => ({ id: x.id, p: x.p, del: !!x.def.del, text: x.def.t, outcome: x.outcome || 'incomplete', arrive: x.arriveT })),
      log: this.log,
    };
  }
}

function errMsg(e) {

}

}

/* ---------- Firebase ---------- */
async function initFirebase() {
  try {
    if (window.FIREBASE_CONFIG_ERROR) throw new Error(window.FIREBASE_CONFIG_ERROR);
    const m = { firebaseConfig: window.FIREBASE_CONFIG, STORAGE_ENABLED: window.STORAGE_ENABLED };
    firebaseConfig = m.firebaseConfig; STORAGE_ENABLED = !!m.STORAGE_ENABLED;
    if (!firebaseConfig) CONFIG_ERROR = 'index.html 冒頭の FIREBASE_CONFIG が読み取れません';
  } catch (e) {
    CONFIG_ERROR = '設定ブロック: ' + (e?.message || e);
    console.error(e);
    return;
  }
  const c = firebaseConfig || {};
  if (!c.apiKey || /YOUR_/.test(c.apiKey)) return;
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM, A, F] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js'),
    ]);
    const app = appM.initializeApp(c);
    S.fb = { app, A, F, auth: A.getAuth(app), db: F.getFirestore(app) };
    if (STORAGE_ENABLED) {
      const ST = await import(base + 'firebase-storage.js');
      S.fb.ST = ST; S.fb.storage = ST.getStorage(app);
    }
  } catch (e) { console.error(e); S.fb = null; CONFIG_ERROR = 'Firebase: ' + (e?.message || e); }
}

function watchAuth() {
  const { A, F, auth, db } = S.fb;
  A.onAuthStateChanged(auth, async (u) => {
    S.user = u; S.isAdmin = false; S.adminDoc = null;
    if (u) {
      if (!S.profile.name) { S.profile.name = (u.displayName || (u.email || '').split('@')[0]).slice(0, 24); store.set('profile', S.profile); }
      try {
        const snap = await F.getDoc(F.doc(db, 'admins', u.uid));
        if (snap.exists()) { S.isAdmin = true; S.adminDoc = snap.data(); }
      } catch { /* 管理者でなければ読めない */ }
      if (S.pendingCode && !S.autoJoinTried && !S.session && S.view === 'home') {
        S.autoJoinTried = true; guard(() => joinSession(S.pendingCode)); return;
      }
    }
    renderHeader();
    if (S.view !== 'game') rerender();
  });
}

async function loginGoogle() {
  const { A, auth } = S.fb; const p = new A.GoogleAuthProvider();
  try { await A.signInWithPopup(auth, p); }
  catch (e) {
    if (/popup-blocked|operation-not-supported/.test(e.code || '')) return A.signInWithRedirect(auth, p);
    throw e;
  }
}

async function audit(action, extra = {}) {
  if (!S.fb || !S.user) return;
  const { F, db } = S.fb;
  try {
    await F.addDoc(F.collection(db, 'auditLogs'), {
      action, uid: S.user.uid, email: S.user.email || '', at: F.serverTimestamp(),
      userAgent: navigator.userAgent.slice(0, 180), ...extra,
    });

}

function playable(prof) {
  const all = Object.values(S.scenarios).filter(s => !s.hidden && Array.isArray(s.tasks) && s.tasks.length);
  const mine = prof ? all.filter(s => s.prof === prof) : all;
  return (mine.length ? mine : all).sort((a, b) => a.id.localeCompare(b.id));
}
function pickScenario(prof, seed) { const list = playable(prof); return list[hashStr(prof + ':' + seed) % list.length]; }

function videoEmbed(url) {
  if (!url || !/^https:\/\//i.test(url)) return `<p class="muted small">${t('noVideo')}</p>`;
  let m;
  const frame = (src) => `<div class="video"><iframe src="${esc(src)}" title="video" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/))) return frame(`https://www.youtube-nocookie.com/embed/${m[1]}`);
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return frame(`https://player.vimeo.com/video/${m[1]}`);
  if ((m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return frame(`https://drive.google.com/file/d/${m[1]}/preview`);
  if (/\.(mp4|webm|ogg|mov)(\?|$)/i.test(url) || /firebasestorage\.googleapis\.com/.test(url)) {
    return `<div class="video"><video controls preload="metadata" src="${esc(url)}"></video></div>`;
  }
  return `<p><a href="${esc(url)}" target="_blank" rel="noopener">${t('openVideo')}</a></p>`;
}
function briefingBlock(sc) {
  return `<div class="brief"><h3>${esc(tx(sc.title))}</h3><p>${esc(tx(sc.intro))}</p>${videoEmbed(S.meta[sc.id]?.videoUrl)}</div>`;
}

/* ---------- セッション（オンライン対戦） ---------- */
function joinLink(code) { return `${location.origin}${location.pathname}?s=${code}`; }
function unsubAll() { S.unsubs.forEach(u => { try { u(); } catch { /* 無視 */ } }); S.unsubs = []; }

async function createSession() {
  const { F, db } = S.fb;
  let code = '';
  for (let i = 0; i < 6; i++) {
    code = Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
    if (!(await F.getDoc(F.doc(db, 'sessions', code))).exists()) break;
  }
  await F.setDoc(F.doc(db, 'sessions', code), {
    hostUid: S.user.uid, hostName: myName(), mode: 'individual', status: 'lobby',
    seed: Math.floor(Math.random() * 1e9), createdAt: F.serverTimestamp(),
  });
  await joinSession(code);
}

async function joinSession(raw) {
  const code = String(raw || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) { toast(t('sessionNotFound'), 'bad'); return; }
  const { F, db } = S.fb;
  const snap = await F.getDoc(F.doc(db, 'sessions', code));
  if (!snap.exists()) { toast(t('sessionNotFound'), 'bad'); return; }
  const s = snap.data();
  const pref = F.doc(db, 'sessions', code, 'players', S.user.uid);
  const mine = await F.getDoc(pref);
  if (s.status !== 'lobby' && !mine.exists()) { toast(t('alreadyStarted'), 'bad'); return; }
  const me = { uid: S.user.uid, name: myName(), prof: S.profile.prof, level: +S.profile.level };
  if (!mine.exists()) await F.setDoc(pref, { ...me, team: 'A', score: 0, finished: false, joinedAt: F.serverTimestamp() });
  else if (s.status === 'lobby') await F.updateDoc(pref, me);
  S.session = { code, ...s }; S.players = []; S.lastResult = null; S.bots = null;
  history.replaceState(null, '', '?s=' + code);
  subscribe(code);
  if (s.status === 'playing') { startMulti(); return; }
  S.view = 'lobby'; renderLobby(true);
}

function subscribe(code) {
  unsubAll();
  const { F, db } = S.fb;
  S.unsubs.push(F.onSnapshot(F.doc(db, 'sessions', code), snap => {
    if (!snap.exists()) { leaveLocal(); go('home'); return; }
    const prev = S.session?.status;
    S.session = { code, ...snap.data() };
    if (prev === 'lobby' && S.session.status === 'playing' && S.view === 'lobby') startMulti();
    else if (S.view === 'lobby') renderLobby(false);
    else if (S.view === 'result' && S.session.status === 'finished') { toast(t('sessionEnded')); updateResultRank(); }
  }));
  S.unsubs.push(F.onSnapshot(F.collection(db, 'sessions', code, 'players'), q => {
    S.players = q.docs.map(d => d.data());
    if (S.view === 'lobby') renderLobby(false);
    else if (S.view === 'result') updateResultRank();
  }));
}

function drawQR(text) {
  const el = $('#qr'); if (!el || !window.QRCode) return;

function startMulti() {
  const sc = pickScenario(S.profile.prof, S.session.seed);
  S.bots = null;
  startGame(sc, { mode: S.session.mode, extraStaff: 0 });
}
function pushScore(final) {
  if (!S.session || !S.fb || !S.user) return;
  const n = Date.now();
  if (!final && n - S.lastPush < 5000) return;
  S.lastPush = n;
  const { F, db } = S.fb;
  const data = final ? { score: final.score, axes: final.axes, finished: true } : { score: S.game.liveScore() };
  F.updateDoc(F.doc(db, 'sessions', S.session.code, 'players', S.user.uid), data).catch(() => {});
}
function leaveLocal() {
  unsubAll();
  S.session = null; S.players = [];
  history.replaceState(null, '', location.pathname);
}
async function leaveSession() {
  if (S.session && S.fb && S.user && S.view === 'lobby') {
    const { F, db } = S.fb;
    await F.deleteDoc(F.doc(db, 'sessions', S.session.code, 'players', S.user.uid)).catch(() => {});
  }
  leaveLocal();
}

/* ---------- ゲーム ---------- */
function startGame(sc, opts) {
  if (S.game) S.game.stop();
  S.lastResult = null; S.lastPush = 0;
  S.gameCtx = { sc, ...opts };
  S.game = new Game({
    scenario: sc, level: +S.profile.level, extraStaff: opts.extraStaff || 0,
    onChange: () => drawGame(),
    onTick: () => tickUI(),
    onEvent: (e) => gameEvent(e),
    onEnd: (r) => endGame(r),
  });
  S.view = 'game';
  renderGameShell();
  countdown(3, () => { beep(660, 0.15); S.game.start(); });
}
function countdown(n, cb) {
  const o = document.createElement('div'); o.className = 'count'; o.setAttribute('aria-live', 'assertive');
  document.body.appendChild(o);
  const step = () => { if (n <= 0) { o.remove(); cb(); return; } o.textContent = n; n--; setTimeout(step, 800); };
  step();
}
function renderGameShell() {
  const { sc, mode } = S.gameCtx || {};
  if (!sc) return go('home');
  view(`<section class="game">
    <div class="gbar">
      <div class="gtitle"><strong>${esc(tx(sc.title))}</strong>
        <span class="meta"><span>${esc(tx(PROFESSIONS[S.profile.prof]))}</span><span>${esc(tx(LEVELS[S.profile.level]))}</span><span>${t(mode === 'team' ? 'modeTeam' : 'modeIndividual')}</span></span></div>
      <div class="gstat"><span class="small">${t('timeLeft')}</span><span id="gTime" class="num">--</span></div>
      <div class="gstat"><span class="small">${t('score')}</span><span id="gScore" class="num">0</span></div>
      <div class="gtools">
        <label class="snd"><input type="checkbox" id="sound" ${S.sound ? 'checked' : ''}> ${t('sound')}</label>
        <button class="btn ghost sm light" data-act="quitGame">${t('quit')}</button>
      </div>
    </div>
    ${+S.profile.level === 0 ? `<p class="hint">${t('hintPriority')}</p>` : ''}
    <div class="ggrid">
      <div class="calls"><h2>${t('calls')}</h2><div id="gCalls"></div></div>
      <div class="side">
        <h2>${t('working')}</h2><div id="gActive"></div>
        <h2>${t('paused')}</h2><div id="gPaused"></div>
        <h2>${t('staff')}</h2><div id="gStaff"></div>
        <h2>${t('ranking')}</h2><div id="gRank"></div>
      </div>
    </div></section>`);
  drawGame();
}
function callCard(x, hint) {
  const id = esc(x.id);
  return `<article class="call" id="c-${id}">
    <span class="lamp ${hint ? 'p' + x.p : ''}"></span>
    <div class="cb"><p class="ct">${esc(tx(x.def.t))}</p>
      ${hint ? `<span class="tag p${x.p}">${esc(tx(PRIORITY[x.p]))}</span>` : ''}
      <div class="dl"><i id="dl-${id}"></i></div></div>
    <div class="ca"><button class="btn sm" data-act="doTask" data-id="${id}">${t('doIt')}</button>
      <button class="btn ghost sm" data-act="delegateTask" data-id="${id}">${t('delegate')}</button></div>
  </article>`;
}
function drawGame() {
  const g = S.game; if (!g || S.view !== 'game' || !$('#gCalls')) return;
  const hint = g.level === 0;
  const pend = g.tasks.filter(x => x.state === 'pending').sort((a, b) => a.arriveT - b.arriveT);
  $('#gCalls').innerHTML = pend.length ? pend.map(x => callCard(x, hint)).join('') : `<p class="empty">${t('noCalls')}</p>`;
  const a = g.active;
  $('#gActive').innerHTML = a
    ? `<div class="work"><p class="ct">${esc(tx(a.def.t))}</p><div class="prog"><i id="gProg"></i></div>
        <button class="btn ghost sm" data-act="memo" ${a.memo ? 'disabled' : ''}>${a.memo ? t('memoDone') : t('memo')}</button></div>`
    : `<p class="empty dark">${t('none')}</p>`;
  const ps = g.tasks.filter(x => x.state === 'paused');
  $('#gPaused').innerHTML = ps.length
    ? ps.map(x => `<div class="pz"><p>${esc(tx(x.def.t))}</p><span class="small ${x.memo ? 'ok' : 'warn'}">${x.memo ? t('memoDone') : t('noMemoLabel')}</span>
        <button class="btn sm" data-act="resumeTask" data-id="${esc(x.id)}">${t('resume')}</button></div>`).join('')
    : `<p class="empty dark">${t('none')}</p>`;
  tickUI();
}
function tickUI() {
  const g = S.game; if (!g || S.view !== 'game' || !$('#gTime')) return;
  const tl = Math.max(0, Math.ceil(g.limit - g.t));
  $('#gTime').textContent = `${Math.floor(tl / 60)}:${String(tl % 60).padStart(2, '0')}`;
  $('#gScore').textContent = g.liveScore();
  if (g.active) { const el = $('#gProg'); if (el) el.style.width = Math.min(100, g.active.progress / g.active.work * 100) + '%'; }
  for (const x of g.tasks) {
    if (x.state !== 'pending') continue;
    const el = document.getElementById('dl-' + x.id);
    if (el) { const f = Math.max(0, (x.deadlineT - g.t) / x.window); el.style.width = f * 100 + '%'; el.classList.toggle('low', f < 0.3); }
    document.getElementById('c-' + x.id)?.classList.toggle('new', g.t - x.arriveT < 3);
  }
  $('#gStaff').innerHTML = g.staff.map(b => `<span class="staff ${b > g.t ? 'busy' : ''}">${b > g.t ? t('staffBusy') : t('staffFree')}</span>`).join('');
  if (S.bots) for (const b of S.bots) b.score = Math.round(b.final * Math.min(1, g.t / (g.limit * 0.85)));
  $('#gRank').innerHTML = rankingHTML(S.gameCtx.mode);
  pushScore();
}
function gameEvent(e) {
  const name = e.task ? tx(e.task.def.t) : '';
  const m = {
    badPriority: [t('ev_badPriority'), 'bad'], badDelegate: [t('ev_badDelegate'), 'bad'], noStaff: [t('noStaff'), ''],
    missed: [t('ev_missed', { task: name }), 'bad'], resumeSlip: [t('ev_resumeSlip'), 'bad'], resumeOk: [t('ev_resumeOk'), 'good'],
    checkWrong: [t('ev_checkWrong'), 'bad'], checkOk: [t('ev_checkOk'), 'good'], delegated: [t('ev_delegated'), 'good'],
  }[e.type];
  if (m) toast(m[0], m[1]);
  if (e.type === 'arrive') beep(880, 0.1);
  if (e.type === 'missed') beep(220, 0.25);
}
function openCheck(x) {
  const c = CHECKS[x.def.chk];
  if (!c) { S.game.answerCheck(x, true); return; }
  const opts = c.o.map((o, i) => ({ o, ok: i === 0 })).sort(() => Math.random() - 0.5);
  modal(`<h2>${t('checkTitle')}</h2><p class="muted">${esc(tx(x.def.t))}</p><p class="q">${esc(tx(c.q))}</p>
    <div class="opts">${opts.map(o => `<button class="opt" data-act="checkAns" data-ok="${o.ok ? 1 : 0}" data-id="${esc(x.id)}">${esc(tx(o.o))}</button>`).join('')}</div>`);
}
async function endGame(r) {
  closeModal();
  S.lastResult = r;
  if (S.bots) S.bots.forEach(b => { b.score = b.final; b.finished = true; });
  S.view = 'result'; renderResult();
  if (S.session) pushScore(r);
  if (S.fb && S.user) {
    const { F, db } = S.fb; const sc = S.gameCtx.sc;
    try {
      await F.addDoc(F.collection(db, 'logs'), {
        uid: S.user.uid, name: myName(), prof: S.profile.prof, level: +S.profile.level,
        scenarioId: sc.id, scenarioTitle: tx(sc.title), mode: S.gameCtx.mode, sessionCode: S.session?.code || null,
        solo: !S.session, score: r.score, total: r.total, maxPossible: r.maxPossible, axes: r.axes, stats: r.stats,
        duration: r.duration, events: r.log.slice(0, 300), lang: S.lang, at: F.serverTimestamp(),
      });
    } catch (e) { console.warn('log', e); }
  }
}

/* ---------- 順位 ---------- */
function rankEntries() {
  if (S.session) {
    return S.players.map(p => ({
      name: p.name, score: p.uid === S.user?.uid && S.game && !S.lastResult ? S.game.liveScore() : (p.score || 0),
      team: p.team, prof: p.prof, finished: p.finished, me: p.uid === S.user?.uid,
    }));
  }

function rankingHTML(mode) {
  const e = rankEntries().sort((a, b) => b.score - a.score);
  let html = '';
  if (mode === 'team') {
    const teams = {};
    for (const x of e) if (x.team) (teams[x.team] ||= []).push(x);
    const ts = Object.entries(teams).map(([k, v]) => {
      const total = v.reduce((s, x) => s + x.score, 0);
      return { k, total, n: v.length, avg: Math.round(total / v.length) };
    }).sort((a, b) => b.avg - a.avg);
    html += `<div class="teams">${ts.map(x => `<div class="team t${esc(x.k)}"><span>${t('team' + x.k)}</span><span class="tavg">${x.avg}</span><span class="small">${t('teamAvg')}${par(`${t('teamTotal')} ${x.total} / ${x.n}`)}</span></div>`).join('')}</div>`;
  }
  html += `<ol class="rank">${e.map(x => `<li class="${x.me ? 'me' : ''}"><span class="rn">${esc(x.name)}${x.me ? par(t('you')) : ''}</span>${x.team ? `<span class="tb t${esc(x.team)}">${esc(x.team)}</span>` : ''}${x.prof && PROFESSIONS[x.prof] ? `<span class="muted small">${esc(tx(PROFESSIONS[x.prof]))}</span>` : ''}<span class="rs">${x.score}</span></li>`).join('')}</ol>`;
  return html;
}

function validateTasks(a) {
  if (!Array.isArray(a) || !a.length) return 'tasks = []';
  const ids = new Set();
  for (const [i, x] of a.entries()) {
    const at = `#${i + 1}`;
    if (!x || typeof x !== 'object') return at;
    if (!x.id || ids.has(String(x.id))) return `${at} id`;
    ids.add(String(x.id));
    if (!x.t || !tx(x.t)) return `${at} t`;
    if (![1, 2, 3, 4].includes(x.p)) return `${at} p`;
    for (const k of ['dur', 'dl']) if (!(typeof x[k] === 'number' && x[k] > 0)) return `${at} ${k}`;
    if (!(typeof x.at === 'number' && x.at >= 0)) return `${at} at`;
    if (x.chk && !CHECKS[x.chk]) return `${at} chk`;
    if (x.lv != null && ![0, 1, 2, 3].includes(x.lv)) return `${at} lv`;
  }
  return '';
}
async function saveScenario() {
  const f = new FormData($('#scForm'));
  const id = String(f.get('id') || '').trim();
  if (!/^[a-z0-9-]{2,40}$/.test(id)) return toast(t('badId'), 'bad');
  if (S.draft && S.scenarios[id]) return toast(t('idExists'), 'bad');
  let tasks;
  try { tasks = JSON.parse(f.get('tasks')); } catch { return toast(t('jsonError'), 'bad'); }
  const err = validateTasks(tasks); if (err) return toast(`${t('jsonError')}: ${err}`, 'bad');
  tasks = tasks.map(x => ({ id: String(x.id), t: toObj(x.t), p: x.p, dur: x.dur, dl: x.dl, at: x.at, del: !!x.del, chk: x.chk || null, lv: x.lv || 0 }));
  const data = {
    prof: f.get('prof'), limit: Math.max(60, Math.min(600, +f.get('limit') || 150)), hidden: f.get('hidden') === 'on',
    title: Object.fromEntries(L4.map(l => [l, String(f.get('title_' + l) || '').trim()])),
    intro: Object.fromEntries(L4.map(l => [l, String(f.get('intro_' + l) || '').trim()])),
    tasks,
  };
  if (!data.title.ja && !data.title.en) return toast(t('needTitle'), 'bad');
  const { F, db } = S.fb;
  await F.setDoc(F.doc(db, 'scenarios', id), { ...data, updatedAt: F.serverTimestamp(), updatedBy: S.user.email || S.user.uid });
  await audit('scenario_saved', { scenarioId: id });
  S.draft = null; S.editId = id;
  await loadRemote();
  toast(t('saved'), 'good'); adminScenarios();
}

function downloadCSV(name, rows) {
  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

    guard(() => saveVideoUrl(id, url));
  },
  removeVideo: ({ id }) => { if (confirm(t('confirmDelete'))) guard(() => saveVideoUrl(id, '', 'video_removed')); },
  changePw: () => guard(changePw),
  exportLogs: () => downloadCSV('play-logs.csv', [
    ['date', 'uid', 'name', 'profession', 'level', 'scenarioId', 'scenario', 'mode', 'session', 'score', ...AXES, 'badPriority', 'noMemo', 'badDelegate', 'checkWrong', 'expired', 'done', 'delegated', 'durationSec', 'lang'],
    ...S.logRows.map(r => [iso(r.at), r.uid, r.name, r.prof, r.level, r.scenarioId, r.scenarioTitle, r.mode, r.sessionCode || '', r.score,
      ...AXES.map(a => r.axes?.[a]), ...['badPriority', 'noMemo', 'badDelegate', 'checkWrong', 'expired', 'done', 'delegated'].map(k => r.stats?.[k]), r.duration, r.lang]),
  ]),
  exportAudit: () => downloadCSV('audit-log.csv', [
    ['date', 'action', 'email', 'uid', 'scenarioId', 'url', 'userAgent'],
    ...S.auditRows.map(r => [iso(r.at), r.action, r.email, r.uid, r.scenarioId || '', r.url || '', r.userAgent || '']),
  ]),
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault();
  f(el.dataset, el);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'langSel') setLang(el.value);
  else if (['pName', 'pProf', 'pLevel'].includes(el.id)) saveProfile();
  else if (el.id === 'soloSc') { S.soloScenario = el.value; renderSolo(); }
  else if (el.name === 'soloMode') { S.soloMode = el.value; renderSolo(); }
  else if (el.name === 'sesMode') guard(async () => { const { F, db } = S.fb; await F.updateDoc(F.doc(db, 'sessions', S.session.code), { mode: el.value }); });
  else if (el.name === 'myTeam') guard(async () => { const { F, db } = S.fb; await F.updateDoc(F.doc(db, 'sessions', S.session.code, 'players', S.user.uid), { team: el.value }); });
  else if (el.id === 'sound') { S.sound = el.checked; store.set('sound', S.sound); }
  else if (el.dataset.upload) guard(() => uploadVideo(el.dataset.upload, el.files[0]));
});
document.addEventListener('input', (e) => { if (e.target.id === 'pName') saveProfile(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'joinCode') { e.preventDefault(); ACT.joinSession(); }
  if (e.key === 'Enter' && (e.target.id === 'adPw' || e.target.id === 'adEmail')) { e.preventDefault(); ACT.adminSignIn(); }
});
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (d.matches?.('details[data-preview]') && d.open) d.querySelector('.pv').innerHTML = videoEmbed(S.meta[d.dataset.preview]?.videoUrl);
}, true);
window.addEventListener('hashchange', () => { if (location.hash === '#admin' && S.view !== 'game') go('admin'); });

/* ---------- 起動 ---------- */
(async function main() {
  document.documentElement.lang = S.lang;
  document.title = t('appTitle');
  loadBuiltins();
  S.pendingCode = (new URLSearchParams(location.search).get('s') || '').toUpperCase().slice(0, 6);
  if (location.hash === '#admin') S.view = 'admin';
  renderHeader(); rerender();
  await initFirebase();
  if (S.fb) { await loadRemote(); watchAuth(); }
  renderHeader();
  if (S.view !== 'game') rerender();
})();

</script>
</body>
</html>
