<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="医療者のための多重課題シミュレーション（個人戦・チーム対抗戦）">
<title>多重課題シミュレーション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
<header id="hdr"></header>
<main id="view"><p class="boot">Loading…</p></main>
<div id="toasts" aria-live="polite"></div>
<noscript>JavaScript を有効にしてください。</noscript>
<script>
  // app.js が読み込めないときに原因を画面に出す
  window.addEventListener('error', function (e) {
    var v = document.getElementById('view');
    if (v && v.querySelector('.boot')) {
      v.innerHTML = '<div style="background:#fff;border-left:4px solid #B3261E;padding:1rem;border-radius:6px">'
        + '<strong>読み込みエラー / Load error</strong><p style="font-size:.9rem;word-break:break-all">'
        + String((e.message || '') + ' ' + ((e.target && (e.target.src || e.target.href)) || e.filename || '')).replace(/</g, '&lt;')
        + '</p><p style="font-size:.9rem">js フォルダの配置とファイル名（小文字）を確認してください。</p></div>';
    }
  }, true);
  setTimeout(function () {
    var v = document.getElementById('view');
    if (v && v.querySelector('.boot')) v.querySelector('.boot').textContent =
      'Loading が続く場合：js/app.js が読み込めていません。F12 のコンソールでエラーを確認してください。';
  }, 6000);
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
